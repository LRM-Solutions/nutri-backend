paths:
  /anamnese-personalizada:
    post:
      summary: Cria uma nova pergunta de anamnese personalizada
      tags:
        - Anamnese Perguntas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - titulo
              properties:
                titulo:
                  type: string
                  example: Você sente dores ao realizar exercícios físicos?
                conteudo:
                  type: string
                  nullable: true
                  example: Detalhes adicionais sobre a dor sentida durante os exercícios
      responses:
        '201':
          description: Pergunta criada com sucesso
        '400':
          description: Erro de validação
        '401':
          description: Não autorizado

  /anamnese-personalizada/{anamneseperguntasid}:
    put:
      summary: Atualiza uma pergunta de anamnese personalizada
      tags:
        - Anamnese Perguntas
      parameters:
        - name: anamneseperguntasid
          in: path
          required: true
          schema:
            type: string
          description: ID da pergunta personalizada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - titulo
              properties:
                titulo:
                  type: string
                  example: Você sente dores ao realizar exercícios físicos?
                conteudo:
                  type: string
                  nullable: true
                  example: Dor principalmente na lombar
      responses:
        '200':
          description: Pergunta atualizada com sucesso
        '400':
          description: Erro de validação
        '404':
          description: Pergunta não encontrada
        '401':
          description: Não autorizado

    delete:
      summary: Deleta uma pergunta de anamnese personalizada
      tags:
        - Anamnese Perguntas
      parameters:
        - name: anamneseperguntasid
          in: path
          required: true
          schema:
            type: string
          description: ID da pergunta personalizada a ser deletada
      responses:
        '200':
          description: Pergunta deletada com sucesso
        '404':
          description: Pergunta não encontrada
        '401':
          description: Não autorizado
